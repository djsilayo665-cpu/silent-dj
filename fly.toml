# fly.toml app configuration file generated for silent-dj on 2026-06-29T10:06:11Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'silent-dj'
primary_region = 'jnb'

[experimental]
  cmd = ['node', 'index.js']

[build]
  builder = 'dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
